name: Jarvis CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Note: No lint step is included because no 'lint' script exists in package.json.
      # Per project guidelines, we skip rather than inventing a lint config from scratch.

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test
